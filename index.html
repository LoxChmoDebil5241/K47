<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>K47</title>
</head>
<body>
  <canvas id="game"></canvas>

  <!-- навигация по комнате -->
  <nav id="ui">
    <p id="hint"></p>
    <div id="bar"></div>
  </nav>

  <!-- кнопка меню -->
  <button id="menuBtn" class="menu-btn" aria-label="Меню" hidden><i></i><i></i><i></i></button>

  <!-- блокнот -->
  <section id="nb" class="nb" hidden aria-label="Блокнот">
    <div class="nb-book">
      <div class="nb-page">
        <div class="nb-head"><span>ЖУРНАЛ · К-47</span><span id="nbNum">1 / 50</span></div>
        <textarea id="nbText" maxlength="700" spellcheck="false" placeholder="Пиши здесь…"></textarea>
      </div>
    </div>
    <div class="nb-nav">
      <button class="px" id="nbPrev">◀</button>
      <button class="px" id="nbClose">ЗАКРЫТЬ</button>
      <button class="px" id="nbNext">▶</button>
    </div>
  </section>

  <!-- пауза -->
  <div id="pause" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="pauseTitle">
    <div class="panel">
      <h2 id="pauseTitle" class="glitch" data-text="ПАУЗА">ПАУЗА</h2>
      <p class="sub">ИГРОВОЕ ВРЕМЯ ОСТАНОВЛЕНО</p>
      <div class="list">
        <button class="px" id="pmContinue">ПРОДОЛЖИТЬ</button>
        <button class="px" id="pmSaves">СОХРАНЕНИЯ</button>
        <button class="px" id="pmSettings">НАСТРОЙКИ</button>
        <button class="px danger" id="pmEnd">ЗАКОНЧИТЬ ЦИКЛ</button>
        <button class="px" id="pmExit">ВЫЙТИ</button>
      </div>
    </div>
  </div>
  <div id="saves" class="modal sub-modal" hidden role="dialog" aria-modal="true">
    <div class="panel">
      <h2>СОХРАНЕНИЯ</h2>
      <p class="sub">СОХРАНЁННЫЕ МОМЕНТЫ ЦИКЛА</p>
      <button class="px" id="svNew">СОХРАНИТЬ ПРОГРЕСС</button>
      <div class="slots" id="svList"></div>
      <button class="px" data-back>НАЗАД</button>
    </div>
  </div>
  <div id="settings" class="modal sub-modal" hidden role="dialog" aria-modal="true">
    <div class="panel">
      <h2>НАСТРОЙКИ</h2>
      <p class="sub">&nbsp;</p>
      <div class="list">
        <button class="px" id="stSound"></button>
        <button class="px" id="stFx"></button>
        <button class="px" id="stRead"></button>
        <button class="px" data-back>НАЗАД</button>
      </div>
    </div>
  </div>
  <div id="confirm" class="modal confirm" hidden role="dialog" aria-modal="true">
    <div class="panel">
      <h2 id="cfTitle">ВЫЙТИ ИЗ ИГРЫ?</h2>
      <p class="sub" id="cfSub">НЕСОХРАНЁННЫЙ ЦИКЛ БУДЕТ ПОТЕРЯН</p>
      <div class="row">
        <button class="px" id="cfNo">НЕТ</button>
        <button class="px danger" id="cfYes">ДА</button>
      </div>
    </div>
  </div>

  <!-- заставка -->
  <div id="boot" class="boot" role="button" tabindex="0" aria-label="К-47. Нормы расхода плоти. Цикл-48. Коснитесь экрана.">
    <canvas id="bootFx"></canvas>
    <h1 class="boot-title">
      <span class="bt-k" data-text="К-47.">К-47.</span>
      <span class="bt-main">Нормы расхода плоти.</span>
      <span class="bt-cycle">ЦИКЛ-48</span>
    </h1>
    <p class="bt-press">КОСНИТЕСЬ ЭКРАНА</p>
  </div>
  <div id="bye" class="bye" hidden><p>СЕАНС ЗАВЕРШЁН</p></div>

  <!-- постобработка поверх всего -->
  <div class="post post-scan"></div>
  <div class="post post-vignette"></div>
  <div class="post post-grain"></div>
  <div id="fade"></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
