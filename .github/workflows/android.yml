name: Android APK

# Собирает APK после каждого пуша и выкладывает его в Releases,
# чтобы его можно было скачать прямо с телефона.
on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Сборка веб-версии
        run: |
          npm ci
          npm run build

      - name: Android-проект (Capacitor)
        run: |
          npx cap add android
          npx cap sync android

      - name: Сборка APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/K47-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: K47-apk
          path: K47-*.apk

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: K47 · сборка ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          body: |
            Автосборка из ветки `${{ github.ref_name }}`.
            Скачайте файл `K47-${{ github.run_number }}.apk` ниже и установите на телефон.
          files: K47-*.apk
